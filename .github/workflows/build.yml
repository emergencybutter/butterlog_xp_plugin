# Builds the plugin on every push and pull request, and keeps the packaged
# win.xpl as a workflow artifact. macOS and Linux builds come later, with
# signing and notarisation (sim-native telemetry rollout, phase 9).
name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/butterlog_xp_plugin"
          New-Item -ItemType Directory -Path "$dir/64" -Force | Out-Null
          Copy-Item target/release/butterlog_xp_plugin.dll "$dir/64/win.xpl"
          Copy-Item aircraft-characteristics.csv "$dir/"
          Copy-Item INSTALL.txt "$dir/"

      - uses: actions/upload-artifact@v4
        with:
          name: butterlog_xp_plugin-windows
          path: dist/butterlog_xp_plugin
