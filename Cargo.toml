[package]
name = "butterlog_xp_plugin"
version = "0.3.0"
edition = "2021"
description = "X-Plane 12 plugin for Butterlog: multiplayer aircraft over UDP, and telemetry to the app over a localhost TCP link"

[lib]
crate-type = ["cdylib"]

[features]
# Records every frame's datarefs to Output/butterlog for the sim-native telemetry
# measurements (rollout phase 1). Not for release builds.
capture-spike = []

[dependencies]
xplm = "0.4"
xplm-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
walkdir = "2.4"
csv = "1.3"
