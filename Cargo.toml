[package]
name = "butterlog_xp_plugin"
version = "0.2.1"
edition = "2021"
description = "X-Plane 12 plugin for Butterlog to proxy multiplayer aircraft via UDP"

[lib]
crate-type = ["cdylib"]

[dependencies]
xplm = "0.4"
xplm-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
walkdir = "2.4"
csv = "1.3"
